name: Build Painuzz FF

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: theos/theos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: Show artifacts
        run: |
          find .theos packages -maxdepth 5 \( -name '*.dylib' -o -name '*.deb' \) | tee artifacts.txt

      - uses: actions/upload-artifact@v4
        with:
          name: painuzz-ff
          path: |
            .theos/obj/**/*.dylib
            packages/*.deb
          if-no-files-found: warn